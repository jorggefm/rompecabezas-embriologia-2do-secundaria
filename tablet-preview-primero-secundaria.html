<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Tablet - Primero de Secundaria</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #10294a, #061426);
      color: #eef5ff;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .layout {
      width: min(1400px, 100%);
      display: grid;
      gap: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .toolbar button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
      color: #eef5ff;
    }

    .toolbar button.active {
      background: #69d2ff;
      color: #08213c;
      font-weight: 700;
    }

    .tablet-shell {
      margin: 0 auto;
      background: #151a21;
      border-radius: 36px;
      padding: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
      transition: width 180ms ease, height 180ms ease;
    }

    .tablet-shell.landscape {
      width: min(100%, 1120px);
      aspect-ratio: 16 / 10;
    }

    .tablet-shell.portrait {
      width: min(100%, 760px);
      aspect-ratio: 10 / 16;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 24px;
      background: #0d1b2f;
    }

    .note {
      text-align: center;
      color: #bfd2f2;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="toolbar">
      <button class="active" data-mode="landscape">Tablet horizontal</button>
      <button data-mode="portrait">Tablet vertical</button>
      <button id="reloadBtn">Recargar vista</button>
    </div>
    <div class="tablet-shell landscape" id="shell">
      <iframe id="frame" src="rompecabezas-primero-secundaria.html" title="Simulacion de tablet para primero de secundaria"></iframe>
    </div>
    <div class="note">
      Esta vista sirve para comprobar rapidamente si la aplicacion entra completa en una pantalla tipo tablet sin scroll de pagina.
    </div>
  </div>

  <script>
    const shell = document.getElementById("shell");
    const frame = document.getElementById("frame");
    const reloadBtn = document.getElementById("reloadBtn");
    const buttons = [...document.querySelectorAll("[data-mode]")];

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.dataset.mode;
        shell.className = `tablet-shell ${mode}`;
        buttons.forEach((item) => item.classList.toggle("active", item === button));
      });
    });

    reloadBtn.addEventListener("click", () => {
      frame.src = frame.src;
    });
  </script>
</body>
</html>
